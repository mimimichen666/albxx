<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文献综述 Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #f4f6fb; --card: #ffffff; --ink: #101828; --slate: #475569;
  --muted: #98a2b3; --border: #e4e9f2; --brand: #4f46e5; --brand-2: #7c3aed;
  --brand-lt: #eef2ff; --brand-grad: linear-gradient(135deg, #4f46e5, #7c3aed);
  --red: #b91c1c; --red-lt: #fee2e2; --amber: #b45309; --amber-lt: #fef3c7;
  --green: #047857; --green-lt: #d1fae5;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
  --shadow-lg: 0 4px 8px rgba(79,70,229,.10), 0 12px 32px rgba(16,24,40,.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
       background: var(--bg);
       background-image: radial-gradient(1200px 400px at 80% -80px, rgba(124,58,237,.07), transparent),
                         radial-gradient(900px 320px at 8% -60px, rgba(79,70,229,.06), transparent);
       background-repeat: no-repeat;
       color: var(--ink); font-size: 14px;
       /* 长英文词/URL/公式允许折行，不再把布局撑出横向滚动条 */
       overflow-wrap: break-word; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 32px; }
header { display: flex; align-items: center; gap: 12px; padding: 4px 0 18px; }
header h1 { font-size: 20px; letter-spacing: .2px;
            background: var(--brand-grad); -webkit-background-clip: text;
            background-clip: text; color: transparent; }
header .sub { color: var(--muted); font-size: 12.5px; }
.badge { font-size: 12px; padding: 2.5px 11px; border-radius: 999px;
         border: 1px solid transparent; font-weight: 600; }
.badge.running { background: var(--amber-lt); color: var(--amber);
                 border-color: #fcd34d; animation: pulse 1.6s ease-in-out infinite; }
.badge.done { background: var(--green-lt); color: var(--green); border-color: #a7f3d0; }
.badge.error, .badge.cancelled { background: var(--red-lt); color: var(--red); border-color: #fecaca; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .55 } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
.card { background: var(--card); border: 1px solid var(--border);
        border-radius: 14px; padding: 16px; box-shadow: var(--shadow);
        animation: fadeUp .3s ease both; }

/* 左栏：表单 + 任务列表 */
#topic { width: 100%; height: 72px; padding: 10px 12px; border: 1px solid var(--border);
         border-radius: 10px; resize: vertical; font: inherit; background: #fbfcfe;
         transition: border-color .15s, box-shadow .15s, background .15s; }
#topic:focus { outline: none; border-color: var(--brand); background: #fff;
               box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
.form-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.form-row label { font-size: 12px; color: var(--slate); display: block; margin-bottom: 4px;
                  font-weight: 600; }
.form-row label.checkbox { font-weight: 400; display: flex; align-items: center;
                           gap: 6px; cursor: pointer; margin-bottom: 0; }
select, input[type=number] { padding: 7px 10px; border: 1px solid var(--border);
         border-radius: 10px; font: inherit; background: #fff; color: var(--ink);
         transition: border-color .15s, box-shadow .15s; }
select:focus, input[type=number]:focus { outline: none; border-color: var(--brand);
         box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
button { padding: 9px 16px; border: none; border-radius: 10px; cursor: pointer;
         font: inherit; font-weight: 600; transition: transform .12s, box-shadow .15s,
         filter .15s, background .15s; }
button:active { transform: scale(.98); }
#btn-run { background: var(--brand-grad); color: #fff; width: 100%; margin-top: 12px;
           padding: 11px; font-size: 15px; box-shadow: 0 4px 14px rgba(79,70,229,.35); }
#btn-run:hover { filter: brightness(1.07); transform: translateY(-1px);
                 box-shadow: 0 6px 18px rgba(79,70,229,.42); }
#btn-run:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
#btn-cancel { background: var(--red-lt); color: var(--red); margin-left: auto; }
#btn-cancel:hover { background: #fecaca; }
#btn-cancel-wrap { gap: 8px; }

.task-item { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
             margin-top: 8px; cursor: pointer; background: #fff;
             transition: border-color .15s, background .15s, transform .12s; }
.task-item:hover { border-color: #c7d2fe; transform: translateY(-1px); }
.task-item.active { border-color: var(--brand); background: var(--brand-lt);
                    box-shadow: inset 3px 0 0 var(--brand); }
.task-item .t { font-size: 13px; font-weight: 600; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
.task-item .m { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex;
                align-items: center; gap: 5px; flex-wrap: wrap; }

/* 右栏：进度 + 结果 */
#stage-bar { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.stage-chip { font-size: 12px; padding: 4.5px 13px; border-radius: 999px;
              background: var(--bg); border: 1px solid var(--border); color: var(--muted);
              transition: all .2s; }
.stage-chip.on { background: var(--brand-lt); border-color: var(--brand);
                 color: var(--brand); font-weight: 700;
                 box-shadow: 0 0 0 3px rgba(79,70,229,.10);
                 animation: pulse 1.8s ease-in-out infinite; }
.stage-chip.done-chip { color: var(--green); border-color: #a7f3d0; background: var(--green-lt); }
.stage-chip.done-chip::before { content: "✓ "; font-weight: 700; }
#logs { height: 230px; overflow-y: auto; overflow-x: auto; background: #0b1220; color: #93a4c4;
        border-radius: 10px; padding: 12px 14px; font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 12px; line-height: 1.75; border: 1px solid #1e2a44; }
#logs .st { color: #a5b4fc; font-weight: 700; }
.tabs { display: flex; gap: 2px; margin-top: 16px; border-bottom: 1px solid var(--border);
        overflow-x: auto; scrollbar-width: thin; }
.tabs button { background: none; border: none; padding: 9px 13px; color: var(--slate);
               border-bottom: 2.5px solid transparent; border-radius: 8px 8px 0 0;
               font-weight: 500; white-space: nowrap; flex: none; }
.tabs button:hover { color: var(--brand); background: var(--brand-lt); }
.tabs button.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 700;
                  background: transparent; }
.tab-body { padding-top: 14px; max-height: 560px; overflow-y: auto; }
.md { line-height: 1.85; }
.md h1, .md h2 { border-bottom: 1px solid var(--border); padding-bottom: 6px; margin: 16px 0 10px; }
.md h3 { margin: 14px 0 6px; }
.md p, .md li { margin: 5px 0; }
.md table { border-collapse: collapse; width: 100%; margin: 10px 0; border-radius: 8px;
            overflow: hidden; }
.md th, .md td { border: 1px solid var(--border); padding: 7px 10px; font-size: 13px; }
.md th { background: var(--brand-lt); }
.md blockquote { border-left: 3px solid var(--brand); padding: 8px 12px; margin: 8px 0;
                 color: var(--slate); background: var(--brand-lt); border-radius: 0 8px 8px 0; }
.md code { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
           padding: 1px 5px; font-size: 12.5px; }
.md a { color: var(--brand); }

/* 统计条 */
#stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px; margin: 14px 0 2px; }
.stat { background: linear-gradient(180deg, #fff, #fafbff); border: 1px solid var(--border);
        border-radius: 12px; padding: 10px 12px; text-align: center;
        box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.stat .v { font-size: 19px; font-weight: 800;
           background: var(--brand-grad); -webkit-background-clip: text;
           background-clip: text; color: transparent; }
.stat .v.bad { background: linear-gradient(135deg, #b91c1c, #ef4444);
               -webkit-background-clip: text; background-clip: text; color: transparent; }
.stat .k { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* 论文卡片 */
.paper-card { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 9px; background: #fff;
  transition: border-color .15s, box-shadow .15s, transform .12s; }
.paper-card:hover { border-color: var(--brand); box-shadow: var(--shadow-lg);
                    transform: translateY(-1px); }
.paper-num { width: 28px; height: 28px; border-radius: 9px; background: var(--brand-grad);
  color: #fff; font-weight: 700; display: flex; align-items: center;
  justify-content: center; font-size: 12.5px; flex: none; }
.paper-main { flex: 1; min-width: 0; }
.paper-title { font-size: 13.5px; font-weight: 600; line-height: 1.5; }
.paper-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.pdf-btn { flex: none; font-size: 12px; font-weight: 700; color: var(--brand);
  background: var(--brand-lt); border: 1px solid #c7d2fe; border-radius: 9px;
  padding: 5px 14px; text-decoration: none; transition: all .15s; }
.pdf-btn:hover { background: var(--brand); border-color: var(--brand); color: #fff; }

/* 矛盾卡片 */
.conf-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  margin-bottom: 11px; background: #fff; box-shadow: var(--shadow);
  transition: border-color .15s; animation: fadeUp .25s ease both; }
.conf-card:hover { border-color: #c7d2fe; }
.conf-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 10px; }
.pill { font-size: 12px; font-weight: 700; padding: 2.5px 11px; border-radius: 999px;
  white-space: nowrap; border: 1px solid transparent; }
.pill.bad { background: var(--red-lt); color: var(--red); border-color: #fecaca; }
.pill.warn { background: var(--amber-lt); color: var(--amber); border-color: #fcd34d; }
.pill.ok { background: var(--green-lt); color: var(--green); border-color: #a7f3d0; }
.conf-topic { font-size: 13px; color: var(--ink); font-weight: 700; }
.conf-sev { font-size: 11px; color: var(--muted); margin-left: auto; }
.conf-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 9px; }
@media (max-width: 860px) { .conf-pair { grid-template-columns: 1fr; } }
.conf-side { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  background: #fafbff; }
.conf-side.a { border-left: 3px solid var(--brand); }
.conf-side.b { border-left: 3px solid var(--amber); }
.conf-paper { font-size: 12.5px; font-weight: 700; margin-bottom: 5px; }
.conf-paper span { color: var(--muted); font-weight: 400; margin-left: 5px; }
.conf-content { font-size: 12.5px; line-height: 1.7; color: var(--slate); }
.conf-expl { margin-top: 10px; font-size: 12.5px; color: var(--slate);
  background: var(--brand-lt); border: 1px solid #e0e7ff; border-radius: 10px;
  padding: 9px 12px; line-height: 1.65; }

/* 核验明细表 */
.rev-table { border-collapse: separate; border-spacing: 0; width: 100%; }
.rev-table th, .rev-table td { border-bottom: 1px solid var(--border); padding: 9px 11px;
  font-size: 12.5px; text-align: left; vertical-align: top; }
.rev-table th { background: var(--brand-lt); font-weight: 700; position: sticky; top: 0; }
.rev-table tr:first-child th { border-top: 1px solid var(--border); border-radius: 10px 10px 0 0; }
.rev-table tr:last-child td { border-bottom: 1px solid var(--border); }
.rev-table tbody tr:hover td { background: #fafbff; }
.rev-table tr { border-radius: 10px; }

.empty { color: var(--muted); text-align: center; padding: 48px 0; line-height: 2; }

/* 失败诊断 */
.err-banner { margin-top: 12px; background: var(--red-lt); border: 1px solid #fecaca;
  color: var(--red); border-radius: 10px; padding: 10px 14px; font-size: 13px;
  line-height: 1.7; font-weight: 600; }
.err-summary { cursor: pointer; font-size: 12.5px; color: var(--slate);
  user-select: none; margin-top: 6px; display: inline-block; }
.err-summary:hover { color: var(--brand); }
.log-pre { margin-top: 8px; background: #0b1220; color: #93a4c4; border-radius: 10px;
  padding: 12px 14px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px;
  line-height: 1.7; max-height: 340px; overflow: auto; white-space: pre-wrap;
  word-break: break-all; border: 1px solid #1e2a44; }
iframe { width: 100%; height: 540px; border: 1px solid var(--border); border-radius: 12px;
         background: #fff; }
.graph-head { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.graph-cap { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.graph-frame { width: 100%; border: 1px solid var(--border); border-radius: 12px;
               background: #fff; }
.hidden { display: none !important; }
#toast { position: fixed; top: 18px; right: 18px; background: var(--red); color: #fff;
         padding: 11px 18px; border-radius: 10px; font-size: 13px; z-index: 99;
         box-shadow: var(--shadow-lg); animation: fadeUp .25s ease both; }

/* ===== 老页面合并功能样式 ===== */
.sort-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.sort-row button { padding: 6px 14px; border-radius: 999px; font-size: 12.5px;
  background: #fff; border: 1px solid var(--border); color: var(--slate); font-weight: 600; }
.sort-row button.on { background: var(--brand-lt); border-color: var(--brand);
  color: var(--brand); }
.badge-sig { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px;
  border-radius: 999px; margin-left: 6px; background: var(--brand-lt); color: var(--brand); }
.badge-sig.hot { background: var(--red-lt); color: var(--red); }
.badge-sig.rel { background: var(--green-lt); color: var(--green); }
.expander { border: 1px solid var(--border); border-radius: 10px; background: #fff;
  margin-bottom: 9px; overflow: hidden; }
.expander > summary { cursor: pointer; padding: 10px 14px; font-size: 13px;
  font-weight: 600; list-style: none; user-select: none; }
.expander > summary::before { content: "▸ "; color: var(--muted); }
.expander[open] > summary::before { content: "▾ "; }
.expander > .exp-body { padding: 4px 14px 12px; font-size: 12.5px; line-height: 1.75;
  color: var(--slate); border-top: 1px dashed var(--border); }
.claim-item { display: flex; gap: 8px; align-items: flex-start; padding: 9px 0;
  border-bottom: 1px dashed var(--border); }
.claim-item:last-child { border-bottom: none; }
.claim-type { flex: none; font-size: 11px; font-weight: 700; padding: 2px 9px;
  border-radius: 999px; margin-top: 1px; }
.claim-type.method { background: var(--brand-lt); color: var(--brand); }
.claim-type.result { background: var(--green-lt); color: var(--green); }
.claim-type.limitation { background: var(--amber-lt); color: var(--amber); }
.claim-content { flex: 1; line-height: 1.65; font-size: 12.5px; }
.mini-btn { flex: none; font-size: 11.5px; font-weight: 700; color: var(--brand);
  background: var(--brand-lt); border: 1px solid #c7d2fe; border-radius: 8px;
  padding: 3px 10px; cursor: pointer; }
.mini-btn:hover { background: var(--brand); color: #fff; }
.quote-blk { border-left: 3px solid #c7d2fe; background: #fafbff; color: var(--slate);
  padding: 6px 10px; margin: 5px 0 5px 0; border-radius: 0 8px 8px 0; font-size: 12px;
  line-height: 1.6; }
.quote-blk .sec { font-weight: 700; color: var(--brand); font-size: 11px; }
/* 聊天 */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; line-height: 1.7;
  font-size: 13.5px; animation: fadeUp .2s ease both; }
.msg.user { align-self: flex-end; background: var(--brand-grad); color: #fff;
  border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: #fff; border: 1px solid var(--border);
  border-bottom-left-radius: 4px; max-width: 96%; }
.msg .src { font-size: 11px; color: var(--muted); margin-top: 6px; }
.msg .warn { background: var(--amber-lt); color: var(--amber); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; margin-top: 6px; }
.chat-input { display: flex; gap: 8px; margin-top: 12px; }
.chat-input input { flex: 1; padding: 10px 13px; border: 1px solid var(--border);
  border-radius: 10px; font: inherit; background: #fbfcfe; }
.chat-input input:focus { outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
.chat-hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.pool-box { border: 1px solid var(--border); border-radius: 12px; background: #fafbff;
  padding: 12px 14px; margin-top: 14px; max-height: 260px; overflow-y: auto; }
.pool-box .pc { font-size: 12px; line-height: 1.6; padding: 6px 0;
  border-bottom: 1px dashed var(--border); }
.pool-box .pc:last-child { border-bottom: none; }
.pool-box .eid { font-size: 10.5px; color: var(--muted); }
/* 弹层（证据穿透） */
#modal { position: fixed; inset: 0; background: rgba(15,23,42,.48); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal .box { background: #fff; border-radius: 16px; max-width: min(920px, 94vw); width: 100%;
  max-height: 92vh; overflow-y: auto; padding: 22px 26px; box-shadow: var(--shadow-lg); }
#modal h3 { font-size: 14.5px; margin-bottom: 8px; }
#modal img { max-width: 100%; border: 1px solid var(--border); border-radius: 8px;
  margin: 8px 0; }
#modal .cap { font-size: 11.5px; color: var(--muted); }
/* 通用小控件 */
.tool-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin: 10px 0; }
.tool-row input[type=text] { flex: 1; min-width: 180px; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: 10px; font: inherit;
  background: #fbfcfe; }
.tool-row input[type=text]:focus { outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
.tool-row select { max-width: 100%; }
.act-btn { background: var(--brand-lt); color: var(--brand); border: 1px solid #c7d2fe;
  font-size: 12.5px; padding: 7px 14px; border-radius: 10px; font-weight: 700; }
.act-btn:hover { background: var(--brand); color: #fff; border-color: var(--brand); }
.act-btn.ghost { background: #fff; color: var(--slate); border-color: var(--border); }
.act-btn:disabled { opacity: .5; cursor: not-allowed; }
.gen-box { border: 1px solid var(--border); border-radius: 12px; background: #fff;
  padding: 14px 16px; margin-top: 10px; }
.section-title { font-size: 13.5px; font-weight: 700; margin: 14px 0 8px; }
.note-item { border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px;
  margin-bottom: 8px; background: #fff; font-size: 12.5px; line-height: 1.6; }
.note-item .np { font-weight: 700; color: var(--brand); }
.note-item .nq { color: var(--muted); font-style: italic; }
.cmp-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 860px) { .cmp-grid { grid-template-columns: 1fr; } }
.cmp-card { border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  background: #fff; box-shadow: var(--shadow); }
.cmp-card h3 { font-size: 13.5px; margin-bottom: 4px; }
.cmp-card .cm { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
.reader-grid { display: grid; grid-template-columns: minmax(0, 2.6fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 900px) { .reader-grid { grid-template-columns: 1fr; } }

/* 滚动条 */
.tab-body::-webkit-scrollbar, #logs::-webkit-scrollbar, #task-list::-webkit-scrollbar,
.tabs::-webkit-scrollbar {
  width: 8px; height: 8px; }
.tab-body::-webkit-scrollbar-thumb, #logs::-webkit-scrollbar-thumb {
  background: rgba(100,116,139,.35); border-radius: 999px; }
.tab-body::-webkit-scrollbar-thumb:hover, #logs::-webkit-scrollbar-thumb:hover {
  background: rgba(100,116,139,.55); }
.tab-body::-webkit-scrollbar-track, #logs::-webkit-scrollbar-track { background: transparent; }

/* 窄屏适配 */
@media (max-width: 920px) {
  .layout { grid-template-columns: 1fr; }
  header { flex-wrap: wrap; }
  .tab-body { max-height: none; }
}

/* ---- P0-2 判决书卡片视图 ---- */
.view-toggle { display: flex; gap: 0; margin: 6px 0 12px; border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden; width: fit-content; }
.vt-btn { border: none; background: var(--card); color: var(--slate); padding: 7px 16px;
  font-size: 12.5px; cursor: pointer; font-family: inherit; }
.vt-btn.on { background: var(--brand-lt); color: var(--brand); font-weight: 600; }
.vc-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; }
.vc-toolbar select { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
  font-size: 12.5px; background: var(--card); color: var(--ink); font-family: inherit; }
.vc-stats { font-size: 12px; color: var(--muted); margin-left: auto; }
.vcard { border: 1px solid var(--border); border-left: 5px solid var(--green);

.vhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.vbadge { font-weight: 700; font-size: 12px; border-radius: 999px; padding: 3px 12px; }
.veid { font-family: monospace; font-size: 11.5px; color: var(--muted); }
.vpaper { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis;

.vclaim { font-size: 13.5px; line-height: 1.6; margin: 6px 0 10px; color: var(--ink); }
.vlvl { background: var(--bg); border-radius: 6px; padding: 8px 10px; font-size: 12.5px;
  margin: 4px 0; line-height: 1.55; color: var(--slate); }

.vimg-wrap img { width: 100%; border: 1px solid var(--border); border-radius: 6px; }
.vfact, .vquote { font-size: 12px; color: var(--slate); margin: 3px 0; line-height: 1.5; }
.vquote { border-left: 3px solid var(--border); padding-left: 8px; }
.vmiss { font-size: 12px; color: var(--amber); background: var(--amber-lt);

/* 卡片栅格：宽屏一行两列，窄屏自动退回单列 */
.vgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));

.vgrid .vcard { margin: 0; height: 100%; }

/* 证据缩略图：固定高度裁剪顶部（PDF 首行高亮通常在页首），点击看大图 */
.vgrid .vimg-wrap img { width: 100%; height: 200px; object-fit: cover;

.vgrid .vimg-wrap img:hover { filter: brightness(1.05) contrast(1.03); }
.vimg-zoom-hint { font-size: 10.5px; color: var(--muted); text-align: right; margin-top: 2px; }
/* 灯箱：点击缩略图后的全屏大图查看 */
#vlightbox { position: fixed; inset: 0; z-index: 200; background: rgba(10, 14, 25, .82);

.vlb-box { max-width: min(1100px, 92vw); max-height: 88vh; display: flex;

.vlb-box img { max-width: 100%; max-height: 80vh; object-fit: contain;

.vlb-cap { color: #e5e9f2; font-size: 12.5px; text-align: center;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
/* 统计证据槽（P1-2 研究空白用：检索式+计数+年趋势，替代 PDF 截图） */
.vstat { margin-top: 10px; }
.vst-tab { border-collapse: collapse; font-size: 12px; margin: 6px 0; width: 100%; }
.vst-tab td { padding: 3px 8px; border-bottom: 1px dashed var(--border); color: var(--slate); }
.vst-tab td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.vst-spark { display: flex; align-items: flex-end; gap: 6px; height: 50px; margin-top: 8px; }
.vst-bar { display: flex; flex-direction: column; align-items: center;
  justify-content: flex-end; flex: 1; height: 100%; }
.vst-bar i { display: block; width: 70%; min-height: 2px; background: var(--brand);
  border-radius: 2px 2px 0 0; }
.vst-bar em { font-size: 10px; color: var(--muted); font-style: normal; margin-top: 2px; }
.vst-cap { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* ---- 检索前引导（词云向导 · 旅程式设计 v2） ---- */
#btn-ob { width: 100%; margin-top: 10px; background: var(--card); border: 1px solid var(--border);
  color: var(--brand); border-radius: 10px; padding: 10px 12px; font-size: 13px;
  cursor: pointer; font-family: inherit; }
#btn-ob:hover { border-color: var(--brand); background: var(--brand-lt); }
/* ---- 初次用户引导提示（4秒无输入时弹一次；fixed 定位 + 视口收拢，绝不被遮挡） ---- */
.nudge-pop { position: fixed; z-index: 120; width: 272px; background: var(--card);
  border: 1.5px solid var(--brand); border-radius: 12px; padding: 15px 17px;
  font-size: 13.5px; line-height: 1.65; color: var(--ink);
  box-shadow: 0 10px 34px rgba(30, 30, 80, .2); }
.nudge-pop b { color: var(--brand); font-size: 14px; }
.nudge-row { display: flex; gap: 8px; margin-top: 10px; }
.nudge-btn { flex: 1; border: none; border-radius: 9px; padding: 8px 10px; font-size: 13px;
  cursor: pointer; font-family: inherit; font-weight: 600;
  background: var(--brand-grad); color: #fff; }
.nudge-btn.ghost { background: var(--card); border: 1px solid var(--border);

.nudge-tip { position: fixed; z-index: 120; white-space: nowrap; cursor: pointer;

@keyframes nudge-bob { 0%, 100% { transform: translateX(0); }
                       50% { transform: translateX(-6px); } }
@media (prefers-reduced-motion: reduce) { .nudge-tip { animation: none; } }
#modal .box { position: relative; }
.ob-close { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px;

.ob-close:hover { color: var(--ink); border-color: var(--slate); }
/* 弹窗头部品牌区 */
.ob-hero { display: flex; gap: 12px; align-items: center; padding-right: 40px; margin-bottom: 16px; }
.ob-hero-ic { width: 42px; height: 42px; border-radius: 12px; background: var(--brand-grad);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex: none; }
.ob-hero h3 { margin: 0; font-size: 16px; color: var(--ink); }
.ob-hero p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
/* 旅程步进条：圆点 + 连接线 + 双行文案 */
.ob-journey { display: flex; align-items: flex-start; margin: 2px 0 18px; }
.ob-jnode { flex: 1; text-align: center; position: relative; }
.ob-jnode::before { content: ""; position: absolute; top: 13px; left: -50%;
  width: 100%; height: 2px; background: var(--border); z-index: 0; }
.ob-jnode:first-child::before { display: none; }
.ob-jnode.done::before { background: var(--brand); }
.ob-jdot { width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 6px;
  display: flex; align-items: center; justify-content: center; font-size: 12px;
  font-weight: 700; position: relative; z-index: 1; background: var(--bg);
  color: var(--muted); border: 2px solid var(--border); }
.ob-jnode.cur .ob-jdot { background: var(--brand-grad); color: #fff;
  border-color: transparent; box-shadow: 0 0 0 4px var(--brand-lt); }
.ob-jnode.done .ob-jdot { background: var(--brand-lt); color: var(--brand);
  border-color: var(--brand); }
.ob-jtitle { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.ob-jnode.cur .ob-jtitle { color: var(--brand); }
.ob-jnode.done .ob-jtitle { color: var(--ink); }
.ob-jsub { font-size: 11px; color: var(--muted); margin-top: 2px; }
/* 步骤切换动画（仅换步时触发，避免选词重渲染闪动） */
.ob-anim { animation: obIn .28s ease both; }
@keyframes obIn { from { opacity: 0; transform: translateY(10px); }
                  to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .ob-anim { animation: none; } }
/* 药丸选择器（身份/阶段） */
.ob-pillgrp { display: flex; gap: 8px; flex-wrap: wrap; }
.ob-pillbtn { border: 1px solid var(--border); background: var(--card); border-radius: 999px;
  padding: 7px 14px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  color: var(--slate); transition: border-color .15s, background .15s, color .15s; }
.ob-pillbtn:hover { border-color: var(--brand); color: var(--brand); }
.ob-pillbtn.on { background: var(--brand-lt); border-color: var(--brand);
  color: var(--brand); font-weight: 600; }
.ob-preset { font-size: 11.5px; color: var(--brand); background: var(--brand-lt);
  border-radius: 8px; padding: 6px 10px; margin-top: 8px; display: inline-block; }
/* 词云区图例 */
.ob-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.ob-legend span { font-size: 11px; color: var(--slate); display: flex;
  align-items: center; gap: 4px; }
.ob-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.ob-field { margin-bottom: 12px; }
.ob-field label { display: block; font-size: 12px; color: var(--slate); margin-bottom: 5px; }
.ob-field textarea, .ob-field select, .ob-field input { width: 100%; border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit;
  background: var(--card); color: var(--ink); }
.ob-field textarea { min-height: 56px; resize: vertical; }
.ob-field textarea:focus, .ob-field select:focus, .ob-field input:focus {

.ob-actions { display: flex; gap: 8px; margin-top: 14px; }
.ob-btn { border: none; background: var(--brand-grad); color: #fff; border-radius: 10px;
  padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  transition: opacity .15s, transform .15s; }
.ob-btn:hover { opacity: .92; }
.ob-btn:active { transform: scale(.98); }
.ob-btn:disabled { opacity: .5; cursor: not-allowed; }
.ob-btn.ghost { background: var(--card); border: 1px solid var(--border); color: var(--slate);
  font-weight: 400; }
.ob-btn.ghost:hover { border-color: var(--brand); color: var(--brand); opacity: 1; }
.ob-spherewrap { margin-bottom: 14px; }
.ob-sphere { position: relative; height: 360px; border-radius: 12px;

.ob-word { position: absolute; left: 0; top: 0; white-space: nowrap; cursor: pointer;

.ob-word.picked { text-decoration: line-through; filter: saturate(.4); }
.ob-word.focus { text-shadow: 0 0 14px currentColor; }
.ob-spherehint { text-align: center; font-size: 11px; color: var(--muted); margin-top: 6px; }
.ob-grp { margin-bottom: 12px; }
.ob-grp b { font-size: 12px; display: block; margin-bottom: 6px; }
.ob-pill { display: inline-block; border: 1px solid var(--border); border-radius: 999px;
  padding: 3px 11px; margin: 0 6px 6px 0; font-size: 12.5px; cursor: pointer;

.ob-pill.on { border-color: currentColor; font-weight: 600; background: var(--brand-lt); }
.ob-termcard { background: var(--bg); border-radius: 10px; padding: 12px 14px; font-size: 12.5px;
  line-height: 1.6; color: var(--slate); margin-bottom: 12px; }
.ob-termcard b { color: var(--ink); }
.ob-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.ob-chip { background: var(--brand-lt); color: var(--brand); border-radius: 999px;
  padding: 2px 10px; font-size: 11.5px; }
.ob-preview { background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; font-size: 13px; color: var(--slate); margin-bottom: 12px; line-height: 1.6; }
.ob-preview b { color: var(--ink); }
.ob-grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 12px; }
.ob-est { font-size: 12px; color: var(--slate); background: var(--bg); border-radius: 8px;
  padding: 8px 12px; margin-top: 10px; line-height: 1.6; }

/* ---- 结果中转页（引导关键词 ↔ 论文关联 + 分流） ---- */
.br-kwrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.br-kwchip { position: relative; display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; padding: 6px 12px 8px; border-radius: 10px; overflow: hidden;
  background: var(--brand-lt); border: 1px solid var(--border); color: var(--ink); font-weight: 600; }
.br-kwchip i { font-style: normal; color: var(--slate); font-size: 11.5px; font-weight: 400; }
.br-kwchip u { position: absolute; left: 0; bottom: 0; height: 3px;
  background: var(--brand-grad); text-decoration: none; }
.br-summary { margin: 6px 0 2px; }
.br-row { display: flex; align-items: center; gap: 10px; padding: 9px 6px;
  border-bottom: 1px dashed var(--border); }
.br-no { width: 22px; height: 22px; flex: 0 0 22px; border-radius: 7px;
  background: var(--brand-lt); color: var(--brand); font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; }
.br-main { flex: 1; min-width: 0; }
.br-title { font-size: 13px; font-weight: 600; line-height: 1.4; }
.br-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.br-hits { display: flex; flex-wrap: wrap; gap: 5px; max-width: 46%; justify-content: flex-end; }
.br-hit { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; white-space: nowrap;
  background: var(--bg); border: 1px solid var(--border); color: var(--slate); }
.br-hit.strong { background: var(--brand-lt); border-color: var(--brand);

.br-hit.claim { background: #ecfdf5; border-color: #a7f3d0; color: #059669; }
.br-note { flex-basis: 100%; font-size: 12px; color: var(--slate); background: var(--bg);
  border: 1px dashed var(--border); border-radius: 8px; padding: 8px 12px; line-height: 1.6; }
.br-hit.none { border-style: dashed; }
.br-actions { display: flex; gap: 10px; margin: 14px 0 4px; flex-wrap: wrap; }
.br-btn { flex: 1; min-width: 200px; padding: 11px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: #fff; color: var(--ink);
  font: inherit; font-weight: 600; cursor: pointer; }
.br-btn:hover { border-color: var(--brand); color: var(--brand); }
.br-btn.primary { background: var(--brand-grad); border: none; color: #fff; }
.br-btn.primary:hover { opacity: .92; color: #fff; }
#br-papers { margin-top: 8px; }
.br-paper { border: 1px solid var(--border); border-radius: 12px; padding: 12px;
  margin: 10px 0; background: #fff; }
.br-paper:hover { border-color: var(--brand); box-shadow: var(--shadow-lg); }
.br-paper-h { display: flex; align-items: flex-start; gap: 10px; }
.br-paper-h > div { flex: 1; min-width: 0; }
.br-score { flex: 0 0 auto; font-size: 11.5px; color: var(--brand);
  background: var(--brand-lt); border-radius: 999px; padding: 3px 10px; }
.br-abs { font-size: 12.5px; color: var(--slate); margin-top: 6px; line-height: 1.6; }

.br-back { font-size: 12px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--border); background: #fff; color: var(--slate);
  cursor: pointer; font: inherit; }
.br-back:hover { color: var(--brand); border-color: var(--brand); }

<body>
<div class="wrap">
  <header>
    <h1>📚 文献综述 Agent</h1>
    <span class="sub">多Agent流水线 · 两级幻觉核验 · 证据链穿透</span>
    <span id="hdr-badge" class="badge hidden"></span>
  </header>

  <div class="layout">
    <!-- 左栏 -->
    <div>
      <div class="card">
        <textarea id="topic" placeholder="输入研究主题，例如：脉冲神经网络的训练方法"></textarea>
        <div class="form-row">
          <div style="flex:1">
            <label>检索模式</label>
            <select id="mode" style="width:100%">
              <option value="standard">📌 标准（推荐）</option>
              <option value="mode1">🌱 入门综述模式</option>
              <option value="mode2">🚀 前沿突破模式</option>
              <option value="mode3">🔀 交叉领域模式</option>
            </select>
          </div>
          <div style="width:80px">
            <label>年限</label>
            <input id="years" type="number" value="2" min="1" max="10" style="width:100%">
          </div>
          <div style="width:80px">
            <label>篇数</label>
            <input id="top_k" type="number" value="6" min="3" max="20" style="width:100%">
          </div>
        </div>
        <div class="form-row">
          <label class="checkbox"><input type="checkbox" id="fast"> 快速模式（跳过引用链与矛盾检测，约3分钟）</label>
        </div>
        <button id="btn-ob" type="button">🧭 智能引导（生成词云·新手推荐）</button>
        <button id="btn-run">开始综述</button>
        <div id="btn-cancel-wrap" class="hidden" style="display:flex;margin-top:8px">
          <button id="btn-cancel">终止当前任务</button>
        </div>
      </div>

      <div class="card" style="margin-top:12px">
        <b style="font-size:13px">任务历史</b>
        <div id="task-list"><div class="empty" style="padding:16px">暂无任务</div></div>
      </div>
    </div>

    <!-- 右栏 -->
    <div class="card" id="right">
      <div id="placeholder" class="empty">
        <div style="font-size:44px;line-height:1.4">📚</div>
        <div style="font-size:15px;font-weight:700;color:var(--slate)">开始你的第一篇文献综述</div>
        <div style="font-size:12.5px">左侧输入主题并点击「开始综述」<br>页面随时可刷新/关闭，任务在服务器后台继续运行</div>
      </div>

      <!-- 进度面板 -->
      <div id="progress-panel" class="hidden">
        <div style="display:flex;align-items:center;gap:8px">
          <b id="run-topic"></b>
          <span id="run-badge" class="badge">运行中</span>
        </div>
        <div id="stage-bar"></div>
        <div id="logs"></div>
      </div>

      <!-- 结果中转页：引导关键词 ↔ 论文 关联 + 分流选择 -->
      <div id="bridge-panel" class="hidden">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <b id="br-topic"></b>
          <span class="badge done">已完成</span>
        </div>
        <div id="br-sub" style="font-size:12.5px;color:var(--slate);margin-top:5px;line-height:1.7"></div>
        <div id="br-kw" class="br-kwrow"></div>
        <div id="br-summary" class="br-summary"></div>
        <div class="br-actions">
          <button class="br-btn primary" onclick="brShowPapers()">📄 直接看筛选出的论文</button>
          <button class="br-btn" onclick="brEnterFull()">🔍 查看更多信息 · 进入完整结果</button>
        </div>
        <div id="br-papers" class="hidden"></div>
      </div>

      <!-- 结果面板 -->
      <div id="result-panel" class="hidden">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <b id="res-topic"></b>
          <span id="res-badge" class="badge"></span>
          <span id="res-hallu" class="badge hidden"></span>
          <button id="btn-back-bridge" class="br-back hidden" onclick="brBack()">← 返回中转页</button>
        </div>
        <div id="stat-row" class="hidden"></div>
        <div id="res-err" class="hidden">
          <div class="err-banner"></div>
          <details>
            <summary class="err-summary">▸ 展开运行日志（最后150行）</summary>
            <pre id="err-log" class="log-pre"></pre>
          </details>
        </div>
        <div class="tabs">
          <button data-tab="search" class="on">🔍 检索结果</button>
          <button data-tab="cards">📄 信息卡片</button>
          <button data-tab="review">✅ 核验明细</button>
          <button data-tab="qa">💬 可信问答</button>
          <button data-tab="assist">🤖 AI助手</button>
          <button data-tab="survey">📚 综述总结</button>
          <button data-tab="blind">🎯 盲区与覆盖</button>
          <button data-tab="conflicts">⚡ 矛盾与张力</button>
          <button data-tab="table">📊 综述表格</button>
          <button data-tab="graph">🕸 引用图谱</button>
          <button data-tab="reader">📚 论文原文</button>
          <button data-tab="compare">⚔️ 对比阅读</button>
          <button data-tab="guide">📖 新手指南</button>
        </div>

<script>
const STAGES = ["规划", "检索", "提取", "审查", "综合", "矛盾检测", "证据定位", "盲区分析"];
const $ = s => document.querySelector(s);
let pw = localStorage.getItem("pw") || "";
let curTask = null, es = null, seenLogs = 0;

function toast(msg) {
  const t = document.createElement("div");
  t.id = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
async function api(path, opts = {}) {
  const o = Object.assign({}, opts);
  o.headers = Object.assign({}, o.headers || {}, {"X-App-Password": pw});
  // 超时/取消支持（2026-11-22 词云卡死修复）:
  //  - opts.timeoutMs: 到时自动 abort，避免 fetch 无限挂起（后端最坏
  //    重试几分钟时前端永远"生成中…"，体感即页面卡死）
  //  - opts.signal: 调用方可传入自己的 AbortController 实现"取消"
  const to = o.timeoutMs; delete o.timeoutMs;
  const ctl = new AbortController();
  if (o.signal) {
    if (o.signal.aborted) ctl.abort(o.signal.reason);
    else o.signal.addEventListener("abort", () => ctl.abort(o.signal.reason));
  }
  let timedOut = false;
  if (to) setTimeout(() => { timedOut = true; ctl.abort(); }, to);
  o.signal = ctl.signal;
  let r;
  try { r = await fetch(path, o); }
  catch (e) {
    if (timedOut) throw new Error("请求超时，请检查网络/服务是否在线后重试");
    throw e;   // 用户主动取消(AbortError)原样上抛，由调用方区分
  }
  if (r.status === 401) {
    const v = prompt("请输入访问密码");
    if (v !== null) { pw = v; localStorage.setItem("pw", v); delete o.headers; return api(path, o); }
    throw new Error("需要访问密码");
  }
  if (!r.ok) {
    let msg = r.status;
    try { msg = (await r.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return r.json();
}

async function apiText(path) {
  const r = await fetch(path, {headers: {"X-App-Password": pw}});
  if (r.status === 401) {
    const v = prompt("请输入访问密码");
    if (v !== null) { pw = v; localStorage.setItem("pw", v); return apiText(path); }
    throw new Error("需要访问密码");
  }
  if (!r.ok) throw new Error("加载失败(" + r.status + ")");
  return r.text();
}

async function ensureAuth() {
  try {
    const h = await fetch("/api/health").then(r => r.json());
    if (!h.app_password) return true;
    await api("/api/tasks");
    return true;
  } catch (e) { return false; }
}

async function refreshTasks(selectId) {
  const tasks = await api("/api/tasks");
  const box = $("#task-list");
  box.innerHTML = "";
  if (!tasks.length) box.innerHTML = '<div class="empty" style="padding:16px">暂无任务</div>';
  tasks.forEach(t => {
    const d = document.createElement("div");
    d.className = "task-item" + (t.id === selectId ? " active" : "");
    d.innerHTML = `<div class="t">${esc(t.topic)}</div>
      <div class="m"><span class="badge ${t.state}">${stateText(t.state)}</span>
      ${t.mode}${t.fast ? "·快速" : ""} · ${t.submitted_at || ""}</div>`;
    d.onclick = () => selectTask(t.id);
    box.appendChild(d);
  });
  return tasks;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
function stateText(s) { return {running: "运行中", done: "完成", error: "失败", cancelled: "已终止", gone: "已失效"}[s] || s; }

/* ---------------- 提交 ---------------- */
$("#btn-run").onclick = async () => {
  const topic = $("#topic").value.trim();
  if (!topic) return toast("请输入研究主题");
  $("#btn-run").disabled = true;
  try {
    const r = await api("/api/run", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        topic, mode: $("#mode").value, fast: $("#fast").checked,
        years: +$("#years").value, top_k: +$("#top_k").value,
        // 智能引导选中的术语（中英对照）；主题不含"重点关注"说明是手动输入，不带
        focus_keywords: (topic.includes("重点关注：") && OB.focusTerms) ? OB.focusTerms : []
      })
    });
    seenLogs = 0;
    await refreshTasks(r.id);
    selectTask(r.id);
  } catch (e) { toast(e.message); }
  $("#btn-run").disabled = false;
};

/* ---------------- 检索前引导（词云向导） ---------------- */
const OB = { step: 1, topic: "", identity: "硕士生", stage: "入门了解", focus: "",
             glossary: null, sel: new Set(), openTerm: -1, loading: false,
             final: null, focusTerms: null, lastStep: 0,
             /* 词云预热（方案1）：主题/画像变动即后台静默生成，点"生成"时大概率秒开 */
             pfTimer: 0, pfDoneKey: "", pfCache: {}, pfState: {},
             /* 解释懒加载（方案2）：点击术语时按需生成，explBusy=进行中 explFail=失败待重试 */
             explBusy: {}, explFail: {} };
const OB_STAGES = ["入门了解", "开题调研", "正式综述", "追前沿", "交叉探索"];
const OB_PRESET = {
  "入门了解": { mode: "mode1", fast: true,  top_k: 5,  years: 2 },
  "开题调研": { mode: "standard", fast: false, top_k: 8,  years: 2 },
  "正式综述": { mode: "standard", fast: false, top_k: 10, years: 3 },
  "追前沿":   { mode: "mode2", fast: false, top_k: 5,  years: 2 },
  "交叉探索": { mode: "mode3", fast: false, top_k: 8,  years: 5 }
};
const OB_CAT = {
  core:        { label: "核心概念 · 它是什么", color: "#2563EB" },
  method:      { label: "方法技术 · 怎么做的", color: "#047857" },
  application: { label: "应用场景 · 用在哪里", color: "#D97706" },
  background:  { label: "背景知识 · 为什么重要", color: "#7C3AED" }
};
const OB_BAR = [
  {t: "描述主题", s: "告诉我们你的研究方向"},
  {t: "挑选关注词", s: "从专属词云选出重点"},
  {t: "确认启动", s: "核对方案，一键开跑"},
];
const OB_MODE_LABEL = {standard: "标准", mode1: "入门综述", mode2: "前沿突破", mode3: "交叉领域"};

function closeModal() { obSphereStop(); $("#modal").classList.add("hidden"); }
function obPresetText() {
  const p = OB_PRESET[OB.stage] || OB_PRESET["开题调研"];
  return `已按「${esc(OB.stage)}」预设：${OB_MODE_LABEL[p.mode] || p.mode}模式 · ${p.top_k} 篇 · 近 ${p.years} 年${p.fast ? " · 快速" : ""}`;
}
function obEstimate() {
  const f = OB.final;
  const min = f.fast ? 3 : (f.top_k <= 6 ? 8 : f.top_k <= 10 ? 15 : 25);
  return `⏱ 预计耗时约 ${min} 分钟${f.fast ? "（快速模式）" : ""} · 期间页面可关闭，任务在后台继续`;
}

/* ---- 词云预热（方案1）：输入主题/切换画像即后台静默生成，点"生成"时大概率秒开 ---- */
function obPfKey() { return OB.topic.trim() + "|" + OB.identity + "|" + OB.stage; }
function obSchedulePrefetch(delay) {
  clearTimeout(OB.pfTimer);
  OB.pfTimer = setTimeout(obMaybePrefetch, delay || 1200);
}
function obMaybePrefetch() {
  if (OB.loading) return;
  const key = obPfKey();
  if (key === OB.pfDoneKey) return;              // 同一组合已预热过
  if (!OB.topic || OB.topic.trim().length < 3) return;
  OB.pfDoneKey = key;
  OB.pfState[key] = "pending";
  OB.pfCache[key] = api("/api/glossary", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ topic: OB.topic.trim(), identity: OB.identity, stage: OB.stage }),
    timeoutMs: 90000
  }).then(g => {
    OB.pfState[key] = "ready";
    return g;
  }).catch(e => {
    delete OB.pfCache[key];                      // 失败不缓存，点"生成"时会重试
    OB.pfState[key] = "failed";
    return null;                                 // 不 re-throw：预热失败静默，生成时由 obGenerate 重试
  });
}

/* ---- 3D 词云球：斐波那契球面分布 + 深度投影 + 拖拽/悬停交互 ---- */
let obRaf = 0;
function obSphereStop() { if (obRaf) { cancelAnimationFrame(obRaf); obRaf = 0; } }
function obSphereInit() {
  obSphereStop();
  const box = $("#ob-sphere");
  if (!box) return;
  const words = [...box.querySelectorAll(".ob-word")];
  const N = words.length;
  if (!N) return;
  const R = Math.max(60, Math.min(box.clientWidth, box.clientHeight) / 2 - 30);
  // 旋转状态跨重渲染保持（选词后球不跳回初始角度）
  if (!OB.rot) OB.rot = { rx: 0.35, ry: 0, idle: 0 };
  const rot = OB.rot;
  // 斐波那契格点：均匀铺满球面，避免拥挤
  const pts = words.map((_, i) => {
    const y = 1 - (i + 0.5) / N, r = Math.sqrt(1 - y * y), th = i * 2.399963;
    return { x: Math.cos(th) * r, y, z: Math.sin(th) * r };
  });
  let drag = null, hover = false;
  box.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY }; box.setPointerCapture(e.pointerId); };
  box.onpointerup = () => { drag = null; rot.idle = Date.now(); };
  box.onpointermove = e => {
    if (!drag) return;
    rot.ry += (e.clientX - drag.x) * 0.005;
    rot.rx = Math.max(-1.2, Math.min(1.2, rot.rx - (e.clientY - drag.y) * 0.005));
    drag = { x: e.clientX, y: e.clientY };
  };
  words.forEach(w => {
    w.onmouseenter = () => { hover = true; };
    w.onmouseleave = () => { hover = false; };
    w.onclick = () => {
      const i = +w.dataset.i;
      OB.openTerm = OB.openTerm === i ? -1 : i;
      obRender();
    };
  });
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const frame = () => {
    if (!$("#ob-sphere")) { obRaf = 0; return; }
    // 自动旋转：拖拽中/悬停中/刚拖完 1.2 秒内暂停
    const spin = !reduced && !drag && !hover && Date.now() - (rot.idle || 0) > 1200;
    if (spin) { rot.ry += 0.0042; rot.rx += Math.sin(rot.ry * 1.7) * 0.0006; }
    const cx = box.clientWidth / 2, cy = box.clientHeight / 2;
    const sx = Math.sin(rot.rx), cxo = Math.cos(rot.rx);
    const sy = Math.sin(rot.ry), cyo = Math.cos(rot.ry);
    words.forEach((w, i) => {
      const p = pts[i];
      const x1 = p.x * cyo + p.z * sy, z1 = -p.x * sy + p.z * cyo;   // 绕Y轴
      const y2 = p.y * cxo - z1 * sx, z2 = p.y * sx + z1 * cxo;      // 绕X轴
      const depth = (z2 + 2) / 3;                                    // 0.33(远)~1(近)
      w.style.transform = `translate(-50%,-50%) translate(${(cx + x1 * R).toFixed(1)}px,${(cy + y2 * R).toFixed(1)}px) scale(${(0.55 + depth * 0.65).toFixed(3)})`;
      w.style.opacity = (0.3 + depth * 0.7).toFixed(2);
      w.style.zIndex = Math.round(depth * 100);
    });
    obRaf = requestAnimationFrame(frame);
  };
  frame();
}

function openObWizard() {
  // 剥离历史「重点关注」段：避免上次拼接结果被带回向导、反复堆叠主题
  OB.step = 1; OB.topic = $("#topic").value.trim()
    .replace(/[（(]重点关注[:：].*?[）)]/g, "").trim();
  OB.glossary = null;
  OB.sel = new Set(); OB.openTerm = -1; OB.loading = false; OB.final = null; OB.focusTerms = null; OB.lastStep = 0;
  $("#modal-box").innerHTML = '<div id="ob-body"></div>';
  $("#modal").classList.remove("hidden");
  obRender();
}
function obBar() {
  return `<div class="ob-hero">
      <div class="ob-hero-ic">🧭</div>
      <div><h3>智能检索引导</h3>
        <p>3 步生成你的专属文献综述方案 · 无需任何专业知识</p></div></div>
    <button type="button" class="ob-close" title="关闭" onclick="closeModal()">✕</button>
    <div class="ob-journey">${OB_BAR.map((s, i) => {
      const st = OB.step === i + 1 ? "cur" : (OB.step > i + 1 ? "done" : "");
      return `<div class="ob-jnode ${st}">
        <div class="ob-jdot">${OB.step > i + 1 ? "✓" : i + 1}</div>
        <div class="ob-jtitle">${s.t}</div><div class="ob-jsub">${s.s}</div></div>`;
    }).join("")}</div>`;
}
function obPillGroup(opts, cur, target) {
  return `<div class="ob-pillgrp">${opts.map(o =>
    `<button type="button" class="ob-pillbtn ${o === cur ? "on" : ""}"
      onclick="${target}='${o}';obRender()">${o}</button>`).join("")}</div>`;
}
function obRender() {
  const el = $("#ob-body");
  if (!el) return;
  // 防御：Step 2 需要词云数据，缺失（如异常状态）时回退 Step 1，避免整页报错
  if (OB.step === 2 && !OB.glossary) OB.step = 1;
  // 药丸选择会触发重渲染：先回收输入框里未提交的主题，避免用户输入丢失
  const curTopic = $("#ob-topic");
  if (curTopic && !OB.loading) OB.topic = curTopic.value;
  if (OB.step !== 2) obSphereStop();
  // 仅换步时播放入场动画，选词等重渲染不闪动
  const anim = OB.lastStep !== OB.step ? `<div class="ob-anim">` : `<div>`;
  OB.lastStep = OB.step;
  if (OB.step === 1) {
    const pfReady = OB.pfState[obPfKey()] === "ready";
    el.innerHTML = `${obBar()}${anim}
      <div class="ob-field"><label>研究主题</label>
        <textarea id="ob-topic" placeholder="例如：脉冲神经网络的高效训练方法"
          oninput="OB.topic=this.value;obSchedulePrefetch()">${esc(OB.topic)}</textarea></div>
      <div class="ob-field"><label>你的身份（影响术语解释的讲法）</label>
        ${obPillGroup(["本科生", "硕士生", "博士生", "研究者", "工程师"], OB.identity, "OB.identity")}</div>
      <div class="ob-field"><label>当前阶段（决定检索预设）</label>
        ${obPillGroup(OB_STAGES, OB.stage, "OB.stage")}
        <div class="ob-preset">${obPresetText()}</div></div>
      <div class="ob-field"><label>关注侧重（可选）</label>
        <input id="ob-focus" value="${esc(OB.focus)}" placeholder="例如：关注硬件实现"
               oninput="OB.focus=this.value"></div>
      <div class="ob-actions">
        <button class="ob-btn grow" id="ob-gen" onclick="obGenerate()"
                ${OB.loading ? "disabled" : ""}>${OB.loading ? "🪄 生成中…"
                  : (pfReady ? "✨ 词云已就绪 · 点击进入" : "🪄 生成我的专属词云")}</button>
        ${OB.loading ? `<button class="ob-btn ghost" onclick="obCancelGen()">✖ 取消</button>` : ""}
        <button class="ob-btn ghost" onclick="closeModal()">跳过引导</button></div>
      ${OB.error ? `<div class="ob-preview">⚠️ ${esc(OB.error)}——可直接跳过引导，用左侧表单检索</div>` : ""}</div>`;
    if (!OB.loading) $("#ob-topic").value = OB.topic;
    obSchedulePrefetch(500);                     // 打开向导/切换画像后自动预热
    return;
  }
  if (OB.step === 2) {
    const terms = OB.glossary.terms;
    // 防御兜底: LLM/历史缓存可能给出预置四类之外的category或异常weight，
    // 直接取下标会抛TypeError导致obRender中断、弹窗永远停在"生成中…"
    const catOf = t => OB_CAT[t.category] || OB_CAT.core;
    const wOf = t => Math.max(1, Math.min(10, Number(t.weight) || 5));
    const cloud = terms.map((t, i) =>
      `<span class="ob-word ${OB.sel.has(i) ? "picked" : ""} ${OB.openTerm === i ? "focus" : ""}"
        data-i="${i}" style="color:${catOf(t).color};font-size:${Math.round(12 + wOf(t))}px"
        title="${esc(t.term_en)} · 相关度${t.weight}">${esc(t.term_zh)}</span>`).join("");
    const groups = Object.keys(OB_CAT).map(c => {
      const list = terms.map((t, i) => ({ t, i })).filter(x => x.t.category === c)
        .sort((a, b) => b.t.weight - a.t.weight);
      if (!list.length) return "";
      return `<div class="ob-grp"><b style="color:${OB_CAT[c].color}">${OB_CAT[c].label}</b>
        ${list.map(x => `<span class="ob-pill ${OB.sel.has(x.i) ? "on" : ""}"
          style="color:${OB.sel.has(x.i) ? OB_CAT[c].color : "inherit"}"
          onclick="OB.sel.has(${x.i})?OB.sel.delete(${x.i}):OB.sel.add(${x.i});OB.openTerm=${x.i};obRender()">
          ${esc(x.t.term_zh)} ${esc(x.t.term_en)}</span>`).join("")}</div>`;
    }).join("");
    const t = OB.openTerm >= 0 ? terms[OB.openTerm] : null;
    // 解释懒加载（方案2）：点击术语时才生成，避免词云请求拖着 70% 的输出 tokens
    let card;
    if (!t) {
      card = `<div class="ob-termcard">👆 点击任意词查看解释，选中后将与主题一起进入检索规划</div>`;
    } else {
      const i = OB.openTerm;
      let explHtml;
      if (t.explanation) {
        explHtml = esc(t.explanation);
      } else if (OB.explFail[i]) {
        explHtml = `⚠️ 解释生成失败 <button class="ob-btn ghost" style="padding:2px 10px;font-size:11px"
          onclick="OB.explFail[${i}]=false;obExplain(${i})">重试</button>`;
      } else {
        explHtml = `⏳ 解释生成中…（首次点击需 2~4 秒，之后缓存秒回）`;
        setTimeout(() => obExplain(i), 0);
      }
      card = `<div class="ob-termcard" style="border-left:4px solid ${catOf(t).color}">
        <b>${esc(t.term_zh)} · ${esc(t.term_en)}</b>
        <span style="color:${catOf(t).color}">［${(catOf(t).label || "术语").split(" · ")[0]} · 相关度 ${t.weight}/10］</span><br>
        ${explHtml}<br>
        <button class="ob-btn" style="padding:5px 12px;font-size:12px;margin-top:6px"
          onclick="OB.sel.has(${OB.openTerm})?OB.sel.delete(${OB.openTerm}):OB.sel.add(${OB.openTerm});obRender()">
          ${OB.sel.has(OB.openTerm) ? "✓ 已加入检索词（点击移除）" : "＋ 加入检索词"}</button></div>`;
    }
    const chips = [...OB.sel].map(i => `<span class="ob-chip">${esc(terms[i].term_zh)}</span>`).join("");
    const legend = Object.keys(OB_CAT).map(c =>
      `<span><i style="background:${OB_CAT[c].color}"></i>${OB_CAT[c].label.split(" · ")[0]}</span>`).join("");
    el.innerHTML = `${obBar()}${anim}
      <div class="ob-legend">${legend}</div>
      <div class="ob-spherewrap">
        <div class="ob-sphere" id="ob-sphere">${cloud}</div>
        <div class="ob-spherehint">🖱 拖拽旋转 · 悬停暂停 · 点击词看解释 · 划线=已选</div>
      </div>${card}${groups}
      <div class="ob-chips">${OB.sel.size ? `已选 ${OB.sel.size} 个：${chips}` : "未选词也可继续（仅用主题检索）"}</div>
      <div class="ob-actions">
        <button class="ob-btn ghost" onclick="OB.step=1;OB.error='';obRender()">← 上一步</button>
        <button class="ob-btn grow" onclick="OB.step=3;obEnterConfirm()">下一步：确认启动${OB.sel.size ? `（已选 ${OB.sel.size} 词）` : ""} →</button></div></div>`;
    obSphereInit();
    return;
  }
  // step 3
  const f = OB.final, names = [...OB.sel].map(i => OB.glossary.terms[i].term_zh);
  const finalTopic = OB.topic + (names.length ? `（重点关注：${names.join("；")}）` : "");
  el.innerHTML = `${obBar()}${anim}

async function obGenerate() {
  OB.topic = $("#ob-topic").value.trim()
    .replace(/[（(]重点关注[:：].*?[）)]/g, "").trim();
  if (!OB.topic) { OB.error = "请先输入研究主题"; obRender(); return; }
  const key = obPfKey();
  const prefetched = OB.pfCache[key];            // 方案1：预热已就绪/进行中 → 直接复用
  OB.loading = true; OB.error = ""; OB.t0 = Date.now();
  OB.ctl = new AbortController();
  // 计时器：让用户看到"真的在动"，不再像卡死（2026-11-22修复）
  OB.tick = setInterval(() => {
    const b = $("#ob-gen");
    if (b && OB.loading)
      b.textContent = `🪄 生成中… ${Math.round((Date.now() - OB.t0) / 1000)} 秒`;
  }, 1000);
  obRender();
  try {
    if (prefetched) {
      OB.glossary = await prefetched;            // 预热失败时返回 null → 走下方错误分支
      if (!OB.glossary) throw new Error("预热生成未完成，请重新点击生成");
    } else {
      OB.glossary = await api("/api/glossary", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic: OB.topic, identity: OB.identity, stage: OB.stage }),
        timeoutMs: 90000, signal: OB.ctl.signal
      });
    }
    OB.pfState[key] = "ready";
    OB.step = 2; OB.openTerm = -1;
  } catch (e) {
    OB.error = e.name === "AbortError" ? "已取消生成"
             : (e.message || "词云生成失败");
    if (prefetched) delete OB.pfCache[key];      // 预热结果失败 → 清缓存以便重试
  }
  clearInterval(OB.tick); OB.loading = false; obRender();
}

/* ---------------- 初次用户引导提示 ----------------
   仅面向"初次打开网站、不了解用途"的用户：
   - 打开网页 4 秒内无任何输入 → 在智能引导按钮旁弹一次提示
   - 用户点过"试试引导/先不用"后永久记住，不再打扰
   - 每次页面加载最多尝试一次；4 秒内有任何操作则视为会用，跳过 */
const NUDGE_KEY = "ob_nudge_done";
function nudgeDone() {
  try { localStorage.setItem(NUDGE_KEY, "1"); } catch (e) { /* 隐私模式等不可用时静默 */ }
}
function clampXY(x, y, w, h) {   // 收拢到视口内，保证任何屏幕尺寸都不被裁剪
  const m = 10;
  if (x + w > window.innerWidth - m) x = window.innerWidth - w - m;
  if (y + h > window.innerHeight - m) y = window.innerHeight - h - m;
  return [Math.max(m, x), Math.max(m, y)];
}
function showNudgeTip(btn) {   // 拒绝后的箭头指引："引导功能在这里"
  nudgeDone();
  const r = btn.getBoundingClientRect();
  const tip = document.createElement("div");
  tip.className = "nudge-tip";
  tip.textContent = "← 引导功能在这里";
  document.body.appendChild(tip);              // fixed 定位 → 挂 body，不受卡片堆叠遮挡
  let [x, y] = clampXY(r.right + 12, r.top + r.height / 2 - tip.offsetHeight / 2,
                        tip.offsetWidth, tip.offsetHeight);
  if (r.right + 12 + tip.offsetWidth > window.innerWidth - 10) {   // 右侧放不下 → 改到按钮上方
    tip.textContent = "↓ 引导功能在这里";
    [x, y] = clampXY(r.left + r.width / 2 - tip.offsetWidth / 2, r.top - tip.offsetHeight - 8,
                     tip.offsetWidth, tip.offsetHeight);
  }
  tip.style.left = x + "px"; tip.style.top = y + "px";
  const off = () => { tip.remove(); document.removeEventListener("pointerdown", off); };
  setTimeout(off, 6000);                       // 6 秒后自动消失，不过度打扰
  document.addEventListener("pointerdown", off); // 点任意处即消失
}
function showNudge(btn) {
  const r = btn.getBoundingClientRect();
  const pop = document.createElement("div");
  pop.className = "nudge-pop";
  pop.innerHTML = `<b>犹豫检索关键词？</b><br>试试智能引导——3 步生成你的专属文献综述方案！
    <div class="nudge-row">
      <button class="nudge-btn" id="nudge-yes">试试引导</button>
      <button class="nudge-btn ghost" id="nudge-no">先不用</button>
    </div>`;
  document.body.appendChild(pop);              // fixed 定位 → 挂 body，不受卡片堆叠遮挡
  let [x, y] = clampXY(r.right + 12, r.top, pop.offsetWidth, pop.offsetHeight);
  if (r.right + 12 + pop.offsetWidth > window.innerWidth - 10) {   // 右侧放不下 → 改到按钮下方
    [x, y] = clampXY(r.left, r.bottom + 8, pop.offsetWidth, pop.offsetHeight);
    if (r.bottom + 8 + pop.offsetHeight > window.innerHeight - 10) // 下方也放不下 → 改到上方
      [x, y] = clampXY(r.left, r.top - pop.offsetHeight - 8, pop.offsetWidth, pop.offsetHeight);
  }
  pop.style.left = x + "px"; pop.style.top = y + "px";
  $("#nudge-yes").onclick = () => { nudgeDone(); pop.remove(); openObWizard(); };
  $("#nudge-no").onclick = () => { pop.remove(); showNudgeTip(btn); };
}
(function nudgeInit() {
  try {
    if (localStorage.getItem(NUDGE_KEY)) return;  // 老用户/已引导过 → 永不自动弹出
    let interacted = false;
    const mark = () => { interacted = true; };
    ["pointerdown", "keydown", "wheel", "touchstart"].forEach(ev =>
      document.addEventListener(ev, mark, { passive: true }));
    setTimeout(() => {
      ["pointerdown", "keydown", "wheel", "touchstart"].forEach(ev =>
        document.removeEventListener(ev, mark));
      if (interacted) return;                     // 4 秒内有输入 → 用户会用，不打扰
      const btn = $("#btn-ob");
      if (!btn) return;
      const modal = $("#modal");
      if (modal && !modal.classList.contains("hidden")) return;  // 弹窗已开着 → 无需提示
      showNudge(btn);
    }, 4000);
  } catch (e) { /* localStorage 异常时放弃该功能 */ }
})();

function connectSSE(id) {
  const url = "/api/tasks/" + id + "/stream" + (pw ? "?pw=" + encodeURIComponent(pw) : "");
  es = new EventSource(url);
  es.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.type === "log") {
      const box = $("#logs");
      const line = document.createElement("div");
      if (d.stage) line.innerHTML = `<span class="st">[${d.stage}]</span> `;
      line.appendChild(document.createTextNode(`${d.t || ""} ${d.msg || ""}`));
      box.appendChild(line);
      box.scrollTop = box.scrollHeight;
      if (d.stage && STAGES.includes(d.stage)) renderStages(d.stage);
    } else if (d.type === "state" && d.state === "running" && d.stage) {
      renderStages(d.stage);
    } else if (d.type === "end") {
      es.close(); es = null;
      selectTask(id);          // 终态：刷新并展示结果

      (total ? stat(total, "声明总数") + stat(okN, "可信声明") +

        (t.hallucination_rate != null ? stat((t.hallucination_rate * 100).toFixed(1) + "%", "幻觉率",
          t.hallucination_rate <= 0.12 ? "" : "bad") : "")
        : "");
    sr.classList.remove("hidden");
  }
}

function norm(s) { return (s || "").toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]/g, ""); }
function paperBadges(p) {
  const b = [];
  if ((p.chain_hits || 0) >= 3) b.push(`🔗引用链经典(被${p.chain_hits}篇种子引用)`);
  else if ((p.chain_hits || 0) > 0) b.push(`🔗引用链(${p.chain_hits})`);
  if ((p.cited_by || 0) >= 300) b.push(`🔥高被引(${p.cited_by})`);
  if ((p.relevance_score || 0) >= 4.5) b.push(`🤖高度切题(${p.relevance_score})`);
  return b;
}
function sortPapers(meta) {
  const s = SORTS[searchSort];
  const by = (k) => (x, y) => (y[k] || 0) - (x[k] || 0);
  if (s === "🤖 相关优先") return [...meta].sort(by("relevance_score"));
  if (s === "🔥 经典优先") return [...meta].sort(by("cited_by"));
  if (s === "🆕 最新优先") return [...meta].sort(by("year"));
  return [...meta].sort(by("final_score"));
}
function renderSearch() {
  const meta = metaList();
  const el = $("#tab-search");
  if (!meta.length) { el.innerHTML = '<div class="empty">暂无检索结果数据</div>'; return; }
  el.innerHTML = `

      <div class="exp-body" id="sig-body"></div></details>
    <div class="chat-hint" style="margin-top:10px">排序依据四路信号加权: <b>相关性</b>(LLM切题度) + <b>RRF共识</b>(多角度命中) + <b>影响力</b>(被引数) + <b>引用链</b>(被种子论文共同引用，奠基经典专属)。</div>
    <div class="sort-row" id="sort-row"></div>
    <div id="search-list"></div>`;
  renderSig(); renderSortRow(); renderSearchList();
}
function renderSig() {
  const {r} = CUR; const meta = metaList();
  const plan = r.plan || {};
  const nChain = meta.filter(p => (p.chain_hits || 0) > 0).length;
  const exempt = meta.filter(p => p.relevance_score == null);
  const classics = plan.classic_titles || [];
  const poolT = meta.map(p => norm(p.title));
  const injected = classics.map(ct => {
    const nc = norm(ct);
    const hit = nc ? meta.find((p, i) => poolT[i] && (poolT[i].includes(nc) || nc.includes(poolT[i]))) : null;
    return {t: ct, hit};
  });
  const stat = (v, k) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  let h = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:6px 0 12px">`
    + stat(`${(plan.keywords || []).length} 组`, "🔑 关键词双路")
    + stat(`${nChain} 篇命中`, "🔗 引用链挖掘")
    + (injected.length ? stat(`${injected.filter(x => x.hit).length}/${injected.length}`, "🧠 LLM先验注入") : stat("—", "🧠 LLM先验注入"))
    + stat(`${exempt.length} 篇`, "🛡 免检通道") + `</div>`;
  h += `<div class="section-title">每篇论文的四信号分解（按综合推荐排序）</div><table class="rev-table"><tr>
        <th>#</th><th style="width:40%">论文</th><th>相关性</th><th>RRF</th><th>被引</th><th>引用链</th><th>综合分</th></tr>` +
    sortPapers(meta).map((p, i) => `<tr><td>${i + 1}</td><td>${esc((p.title || "").slice(0, 38))}</td>
        <td>${p.relevance_score ?? "🛡免检"}</td><td>${(p.rrf_score ?? 0).toFixed ? (p.rrf_score || 0).toFixed(3) : p.rrf_score || "—"}</td>
        <td>${p.cited_by ?? 0}</td><td>${p.chain_hits ?? 0}</td><td>${p.final_score ?? "—"}</td></tr>`).join("") + `</table>`;
  if (injected.length) {
    h += `<div class="section-title">🧠 LLM领域先验名单（规划Agent给出 → 标题反查 → 终选）</div>` +
      injected.map(x => `<div>· ${x.hit ? "✅" : "❌"} 《${esc(x.t.slice(0, 48))}》→ ${x.hit ? "已入终选" : "反查未收录（标题有误会被如实拦截，不虚构收录）"}</div>`).join("");
  }
  if (exempt.length) {
    h += `<div class="section-title">🛡 免检通道名单（共被引≥3，跳过LLM粗筛）</div>` +
      exempt.map(p => `<div>· 《${esc((p.title || "").slice(0, 52))}》— 被 ${p.chain_hits} 篇种子共同引用</div>`).join("");
  }
  if (plan.keywords && plan.keywords.length) {
    h += `<div class="section-title">🔑 检索关键词</div><div>${plan.keywords.map(k => `<span class="badge-sig">${esc(k)}</span>`).join("")}</div>`;
  }
  $("#sig-body").innerHTML = h;
}
function renderSortRow() {

/* ---- 标签: 核验明细（表格/判决书卡片双视图 + Benchmark + 详情展开） ---- */
let reviewView = "table";                       // "table" | "cards"
let reviewFilter = { bucket: "all", paper: "all" };

/* 判定桶口径与 Streamlit 版 _verdict_bucket 一致:
   llm_error且非幻觉→核验失败 / hallucination→剔除 / abstained→暂缓 / 其余→通过 */
function vcBucket(v) {
  const sem = (v.verdict && v.verdict.verdict) || "abstained";
  if ((v.review_status || "ok") === "llm_error" && !v.hallucination) return "error";
  if (v.hallucination) return "hallucination";
  if (sem === "abstained") return "abstained";
  return "supported";
}
const VC_META = {
  supported:     { label: "✅ 核实通过",   color: "var(--green)", bg: "var(--green-lt)" },
  hallucination: { label: "❌ 幻觉剔除",   color: "var(--red)",   bg: "var(--red-lt)" },
  abstained:     { label: "⏸️ 证据不足暂缓", color: "var(--amber)", bg: "var(--amber-lt)" },
  error:         { label: "⚠️ 核验失败",   color: "var(--muted)", bg: "var(--bg)" }
};

/* ---- 通用判定卡片骨架：P0-2 文本证据 / P1-2 统计证据共用 ----
 * spec: { color, bg, badge, meta:[{cls,html}], claim, blocks:[html], evidence:html }
 * 只复用版式与导出能力，不复用判定枚举——各业务自己定义 badge 语义
 * （P0-2 是"真/假"，P1-2 是"红海/蓝海/空白"，硬塞同一套四桶会语义错位） */
function verdictCard(s) {
  const meta = (s.meta || []).filter(Boolean)
    .map(m => `<span class="${m.cls}">${m.html}</span>`).join("\n      ");
  return `<div class="vcard" style="border-left-color:${s.color}">
    <div class="vhead">
      <span class="vbadge" style="background:${s.bg};color:${s.color}">${s.badge}</span>
      ${meta}</div>
    <div class="vclaim">${s.claim}</div>
    ${(s.blocks || []).filter(Boolean).join("\n    ")}
    ${s.evidence || ""}</div>`;
}

/* 统计证据槽（P1-2 研究空白用）：检索式 + 计数表 + 年度分布，替代 PDF 截图。
 * spec: { formula, nA, nB, nAB, years:{2024:3,...}, note } */
function statEvidenceHtml(spec) {
  const years = spec.years || {};
  const keys = Object.keys(years).map(Number).sort((a, b) => a - b);
  const max = Math.max(1, ...keys.map(k => years[k]));
  const bars = keys.map(k => {
    const h = Math.round(years[k] / max * 34);
    return `<span class="vst-bar" title="${k}: ${years[k]} 篇"><i style="height:${h}px"></i><em>${String(k).slice(2)}</em></span>`;
  }).join("");
  const rows = [
    ["领域 A 独立命中", spec.nA],
    ["领域 B 独立命中", spec.nB],
    ["A × B 交叉命中", spec.nAB],
  ].map(([k, v]) => `<tr><td>${esc(k)}</td><td><b>${v == null ? "—" : v}</b></td></tr>`).join("");
  return `<div class="vstat">
    <div class="vlvl"><b>统计证据</b>（OpenAlex 标题+摘要检索，口径固定可复现）</div>
    ${spec.formula ? `<div class="vquote"><code>${esc(spec.formula)}</code></div>` : ""}
    <table class="vst-tab">${rows}</table>
    ${bars ? `<div class="vst-spark">${bars}</div><div class="vst-cap">年度分布（两位数年份）</div>` : ""}
    ${spec.note ? `<div class="vst-cap">${esc(spec.note)}</div>` : ""}</div>`;
}

function vcCardHtml(v, paperTitle, quotes) {
  const b = vcBucket(v), m = VC_META[b];
  const sem = (v.verdict && v.verdict.verdict) || "abstained";
  // 第1级: 程序化引用对齐详情
  const qd = (v.quote_details || []).slice(0, 3).map(d => d.aligned
    ? `✓ 第${(d.page ?? 0) + 1}页 · 置信度${(d.confidence ?? 0).toFixed(2)}`
    : `✗ ${esc(d.section || "")}未定位`).join("；");
  // 第2级: 原子事实拆分
  const FI = { supported: "✅", unsupported: "❌", contradicted: "⚔️", abstained: "⏸️" };
  const facts = (v.atomic_facts || []).slice(0, 6).map(f =>
    `<div class="vfact">${FI[f.verdict] || "•"} <code>${esc(f.verdict)}</code> ${esc((f.fact || "").slice(0, 90))}</div>`).join("");
  const factsHtml = facts ? `<div class="vlvl"><b>原子事实核验</b>${facts}</div>` : "";
  // 证据截图: 内嵌卡片（不再藏在弹层）
  const ev = (CUR.r.evidence || {})[`${v.arxiv_id}#${v.claim_index}`];
  let evHtml;
  if (ev && ev.located && ev.image) {
    const cap = `📎 ${ev.pdf || v.arxiv_id} 第${(ev.page ?? 0) + 1}页 · 黄色高亮=证据原文 · 匹配级别 ${ev.match_level || "?"}`;
    evHtml = `<div class="vimg-wrap">
      <img src="/api/evidence-img/${encodeURIComponent(ev.image)}${pwq()}"
           alt="PDF高亮页" loading="lazy"
           data-cap="${esc(cap).replace(/"/g, "&quot;")}"
           onclick="vcZoom(this)"
           onerror="this.parentNode.innerHTML='<div class=\\'vmiss\\'>⚠️ 证据图片加载失败（服务器重启后 evidence/ 会清空）</div>'">
      <div class="vimg-cap">${esc(cap)} <span class="vimg-zoom-hint">🔍 点击图片放大</span></div></div>`;
  } else if (ev && ev.located) {
    evHtml = `<div class="vmiss">⚠️ 证据图片缺失（服务器重启后 evidence/ 目录会清空）</div>`;
  } else if (ev) {
    evHtml = `<div class="vmiss">引用未能在PDF中定位（无截图）</div>`;
  } else {
    evHtml = `<div class="vmiss">该声明无证据索引（证据截图仅为核验通过的声明生成）</div>`;
  }
  // 引用原文
  const qs = (quotes || []).slice(0, 3).map(q =>
    `<div class="vquote"><code>${esc(q.section || "")}</code> ${esc((q.text || "").slice(0, 160))}</div>`).join("");
  const quotesHtml = qs ? `<div class="vlvl"><b>引用原文</b>${qs}</div>` : "";
  return verdictCard({
    color: m.color, bg: m.bg, badge: m.label,
    meta: [
      { cls: "veid", html: `${esc(v.arxiv_id)}#${v.claim_index}` },
      { cls: "vpaper", html: esc(paperTitle || "") },
    ],
    claim: esc(v.claim_content || ""),
    blocks: [
      `<div class="vlvl"><b>第1级 · 程序化引用对齐</b>：${v.quote_alignment ? "✓ 真实" : "✗ 疑似伪造"}
      ${v.aligned_quote_count != null ? ` · ${v.aligned_quote_count}/${v.quote_count ?? ""}条命中` : ""}
      ${qd ? `<br><span style="font-size:11px">${qd}</span>` : ""}</div>`,
      `<div class="vlvl"><b>第2级 · LLM语义核验</b>：<code>${esc(sem)}</code> · 置信度 ${((v.verdict && v.verdict.confidence) ?? 0).toFixed(2)}
      ${v.verdict && v.verdict.reason ? `<br>${esc(v.verdict.reason)}` : ""}</div>`,
      factsHtml,
    ],
    evidence: evHtml + quotesHtml,
  });
}

function vcZoom(img) {
  const lb = document.createElement("div");
  lb.id = "vlightbox";
  lb.innerHTML = `<div class="vlb-box"><img src="${img.src}" alt="证据原图">
    <div class="vlb-cap">${img.dataset.cap || ""}<span style="opacity:.6">（点击任意处关闭）</span></div></div>`;

  const escClose = (e) => { if (e.key === "Escape") { lb.remove(); document.removeEventListener("keydown", escClose); } };

  document.body.appendChild(lb);
}

function renderVerdictCards(revRows) {
  const r = CUR.r;
  // 论文标题 / 声明引用原文索引
  const titleOf = {}, quotesOf = {};
  (Array.isArray(r.cards) ? r.cards : []).forEach(c => {
    titleOf[c.arxiv_id] = c.title;
    (c.claims || []).forEach((cl, i) => { quotesOf[`${c.arxiv_id}#${i}`] = cl.quotes; });
  });
  const shown = revRows.filter(v =>
    (reviewFilter.bucket === "all" || vcBucket(v) === reviewFilter.bucket) &&
    (reviewFilter.paper === "all" || v.arxiv_id === reviewFilter.paper));
  const stat = {};
  revRows.forEach(v => { const b = vcBucket(v); stat[b] = (stat[b] || 0) + 1; });
  const opt = (val, label, cur) => `<option value="${val}"${val === cur ? " selected" : ""}>${label}</option>`;
  const papers = [...new Set(revRows.map(v => v.arxiv_id))];
  let html = `<div class="vc-toolbar">
    <select onchange="reviewFilter.bucket=this.value;renderReview()">
      ${opt("all", "判定: 全部", reviewFilter.bucket)}
      ${Object.keys(VC_META).map(k => opt(k, VC_META[k].label.slice(2), reviewFilter.bucket)).join("")}
    </select>
    <select onchange="reviewFilter.paper=this.value;renderReview()">
      ${opt("all", "论文: 全部", reviewFilter.paper)}
      ${papers.map(p => opt(p, p, reviewFilter.paper)).join("")}
    </select>
    <span class="vc-stats">共 ${revRows.length} 条 · 显示 ${shown.length} 条
      （✅${stat.supported || 0} ❌${stat.hallucination || 0} ⏸️${stat.abstained || 0} ⚠️${stat.error || 0}）</span>
    <button class="act-btn ghost" onclick="exportVerdictCards()">📤 导出判决书HTML</button></div>`;
  html += shown.length
    ? `<div id="vcards" class="vgrid">${shown.map(v =>
        vcCardHtml(v, titleOf[v.arxiv_id], quotesOf[`${v.arxiv_id}#${v.claim_index}`])).join("")}</div>`
    : '<div class="empty">当前筛选条件下没有声明</div>';
  return html;
}

function renderReview() {
  const r = CUR.r;
  const revRows = Array.isArray(r.review) ? r.review : [];
  let html = `<div class="view-toggle">
    <button class="vt-btn ${reviewView === "table" ? "on" : ""}" onclick="reviewView='table';renderReview()">📋 表格视图</button>
    <button class="vt-btn ${reviewView === "cards" ? "on" : ""}" onclick="reviewView='cards';renderReview()">🗂 判决书卡片视图</button></div>`;
  if (reviewView === "cards") {
    $("#tab-review").innerHTML = html + renderVerdictCards(revRows);
    return;
  }
  if (r.benchmark && r.benchmark.verdict_accuracy != null) {
    const b = r.benchmark;
    const pf = b.precision || {}, rc = b.recall || {}, f1 = b.f1 || {};
    const stat = (v, k) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
    html += `<details class="expander" open><summary>🧪 固定Benchmark评测结果（审查器离线质量）</summary><div class="exp-body">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:10px">
        ${stat((b.verdict_accuracy * 100).toFixed(1) + "%", "Verdict Accuracy")}
        ${stat((b.macro_f1 || 0).toFixed(3), "Macro-F1")}
        ${stat(((b.false_pass_rate || 0) * 100).toFixed(1) + "%", "误放行率")}
        ${stat(b.total_cases ?? "—", "样本数")}</div>
      <table class="rev-table"><tr><th>类别</th><th>Precision</th><th>Recall</th><th>F1</th></tr>
      ${["supported", "unsupported", "contradicted"].map(k =>
        `<tr><td>${k}</td><td>${(pf[k] ?? 0).toFixed(3)}</td><td>${(rc[k] ?? 0).toFixed(3)}</td><td>${(f1[k] ?? 0).toFixed(3)}</td></tr>`).join("")}
      </table></div></details>`;
  }
  html += `<div class="chat-hint">第1级: 程序化引用对齐(抓伪造引用) · 第2级: LLM原子事实核验(抓夸大/曲解,证据不足时暂缓)。点击「详情」展开判定理由/原子事实/引用定位。</div>`;
  if (revRows.length && revRows[0] && revRows[0].claim_content !== undefined) {
    const VC = {supported: ["支持", "ok"], unsupported: ["不支持", "bad"],
                contradicted: ["矛盾", "bad"], abstained: ["暂缓", "warn"]};
    html += `<table class="rev-table"><tr>
        <th style="width:46%">声明</th><th>引用对齐</th><th>语义裁决</th><th>最终结论</th></tr>` +
      revRows.slice(0, 100).map(v => {
        const sem = (v.verdict && v.verdict.verdict) || "abstained";
        const [label, cls] = VC[sem] || [sem, "warn"];
        const fin = v.hallucination ? ["幻觉·剔除", "bad"]
          : (sem === "supported" && v.quote_alignment ? ["可信", "ok"] : ["暂缓/不计", "warn"]);
        const det = [];
        if (v.verdict && v.verdict.reason) det.push(`<b>判定理由</b>: ${esc(v.verdict.reason)}`);
        (v.atomic_facts || []).forEach(f => {
          const ic = {supported: "✅", unsupported: "❌", contradicted: "⚔️", abstained: "⏸️"}[f.verdict] || "•";
          det.push(`${ic} <code>${f.verdict}</code> ${esc((f.fact || "").slice(0, 80))} — ${esc((f.reason || "").slice(0, 60))}`);
        });
        (v.quote_details || []).forEach(d => {
          det.push(d.aligned
            ? `✓ 置信度${(d.confidence ?? 0).toFixed(2)} · 第${(d.page ?? 0) + 1}页 · 命中片段: <code>${esc((d.matched_fragment || "").slice(0, 80))}</code>`
            : `✗ <code>${esc(d.section || "")}</code> 引用未能在原文定位`);
        });
        if ((v.review_status || "ok") === "llm_error") det.push("⚠️ 该声明语义核验调用失败，不计入幻觉，重跑流水线可补判");
        const detHtml = det.length ? `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--brand);font-size:11.5px">详情 (${det.length})</summary>
          <div style="font-size:11.5px;color:var(--slate);line-height:1.7;margin-top:4px">${det.map(d => `<div>· ${d}</div>`).join("")}</div></details>` : "";
        const fm = v.failure_mode && v.failure_mode !== "none"
          ? `<div style="color:var(--muted);font-size:11px;margin-top:2px">失败模式: ${esc(v.failure_mode)}</div>` : "";
        return `<tr><td>${esc(v.claim_content || "")}${fm}${detHtml}</td>
          <td>${v.quote_alignment ? "✓" : "✗"} ${v.aligned_quote_count ?? ""}/${v.quote_count ?? ""}</td>
          <td><span class="pill ${cls}">${label}</span></td>
          <td><span class="pill ${fin[1]}">${fin[0]}</span></td></tr>`;
      }).join("") + `</table>`;
  } else html += '<div class="empty">无核验明细</div>';
  $("#tab-review").innerHTML = html;
}

function renderPool() {

  if (!el) return;
  if (qaPoolErr) { el.innerHTML = `<div class="chat-hint">声明池加载失败: ${esc(qaPoolErr)}（有任务运行时请等其结束）</div>`; return; }

  el.innerHTML = `<b style="font-size:12.5px">📚 当前声明池（问答的知识边界，共${qaPool.length}条）</b>` +
    qaPool.map(c => `<div class="pc">${CLAIM_TC[c.type] || "⚪"} <b>[#${c.num}]</b> ${esc(c.content.slice(0, 80))}${c.content.length > 80 ? "…" : ""}

async function qaSend() {
  const inp = $("#qa-in");
  const q = inp.value.trim();
  if (!q || !CUR) return;
  inp.value = "";
  qaHistory.push({role: "user", content: q});
  appendMsg("qa", "user", q);
  const m = appendMsg("qa", "ai", "⏳ 检索声明池并生成有据回答…");
  try {
    const r = await api(`/api/tasks/${CUR.tid}/qa`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question: q, history: qaHistory.slice(0, -1)})});
    let body = r.answer;
    if (!r.can_answer) body = `⚠️ ${r.answer}\n\n**缺失的证据**: ${r.missing}`;
    const t = m.querySelector(".t");
    t.innerHTML = marked.parse(body);
    if (r.used_claims && r.used_claims.length) {
      const byNum = {};
      (r.pool || []).forEach(c => byNum[c.num] = c);
      t.insertAdjacentHTML("beforeend", `<div class="src">依据: 声明 ${r.used_claims.join(", ")}</div>`);
      r.used_claims.forEach(n => {
        const c = byNum[n];
        if (c) t.insertAdjacentHTML("beforeend",
          `<div class="quote-blk"><span class="sec">[声明#${n}] ${esc(c.paper_title || "")}</span> ${esc(c.content)}${c.quote ? `<br>引用: ${esc(c.quote)}` : ""}${c.page != null ? ` · PDF第${c.page + 1}页` : ""}</div>`);
      });
    }
    qaHistory.push({role: "assistant", content: body});
  } catch (e) { m.querySelector(".t").textContent = "问答失败: " + e.message; }
}
async function refusalTest() {
  const btn = $("#btn-refusal"), box = $("#refusal-box");
  btn.disabled = true;
  box.classList.remove("hidden");
  const lines = [];
  let final = null, buf = "";
  const stat2 = (v, k) => `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  try {
    await streamText(`/api/tasks/${CUR.tid}/refusal-test`, {}, chunk => {
      buf += chunk;
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line) continue;
        let d; try { d = JSON.parse(line); } catch (e) { continue; }
        if (d.type === "case") {
          lines.push(`<div>${d.correct ? "✓" : "✗"} ${d.expect_answerable ? "应答" : "应拒"}→${d.actual_answerable ? "答了" : "拒答"} | ${esc(d.question)}
            <div class="chat-hint">${esc(d.answer_preview)}</div></div>`);
          box.innerHTML = `<div class="chat-hint">测试进行中…（已完成 ${lines.length} 题）</div>` + lines.join("");
        } else if (d.type === "final") final = d;
        else if (d.type === "error") box.innerHTML = esc(d.msg);
      }
    });
    if (final) box.innerHTML =
      `<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:10px">
        ${stat2((final.answerable_acc * 100).toFixed(0) + "%", "可答组正确率")}
        ${stat2((final.refusal_acc * 100).toFixed(0) + "%", "拒答组正确率")}</div>` + lines.join("");
  } catch (e) { box.innerHTML = "测试失败: " + esc(e.message); }
  btn.disabled = false;
}

  m.innerHTML = '<div class="t"></div>';

  else m.querySelector(".t").innerHTML = marked.parse(text || "");
  box.appendChild(m);
  scrollChat(tab);
  return m;
}
